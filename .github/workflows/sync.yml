name: Sync MuMu

# 每天 4 次把 MuMu 官方安装包镜像到 GitHub Releases,按【版本】聚合:
# 同一版本的中国版 + 国际版资产放同一个 Release(tag = mac-<版本> / win-<版本>)。
# 核心逻辑在 scripts/sync.sh(幂等:CDN 上存在但 Release 里没有的资产会被补进去,已完整则跳过)。
# 源均为网易官方公开下载(具体来源地址放仓库 Secret,不写进公开仓库)。

on:
  schedule:
    # 每天 4 次:UTC+8 的 01:00 / 07:00 / 13:00 / 19:00。
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '仅处理某项 (mac/offline/all)'
        required: false
        default: 'all'
      backfill:
        description: '一次性:探测补全 macOS 历史版本 (yes/no,仅手动触发)'
        required: false
        default: 'no'
      merge_from:
        description: '可选:把这个旧 Release 的附件并入 merge_into'
        required: false
        default: ''
      merge_into:
        description: '可选:接收附件的目标 Release'
        required: false
        default: ''

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # 所有官方来源地址 + nx 签名密钥统一放仓库 Secret,不写进公开仓库(与 rhino/flstudio-release 同约定)。
  MUMU_NX_SECRET:     ${{ secrets.MUMU_NX_SECRET }}
  MUMU_CDN:           ${{ secrets.MUMU_CDN }}
  MUMU_DL_MAC_CN:     ${{ secrets.MUMU_DL_MAC_CN }}
  MUMU_DL_MAC_GL:     ${{ secrets.MUMU_DL_MAC_GL }}
  MUMU_DL_WIN_CN:     ${{ secrets.MUMU_DL_WIN_CN }}
  MUMU_DL_WIN_GL:     ${{ secrets.MUMU_DL_WIN_GL }}
  MUMU_NX_HOST_GL:    ${{ secrets.MUMU_NX_HOST_GL }}
  MUMU_NX_HOST_CN:    ${{ secrets.MUMU_NX_HOST_CN }}
  MUMU_WINFULL_INDEX: ${{ secrets.MUMU_WINFULL_INDEX }}

jobs:
  jitter:
    runs-on: ubuntu-latest
    steps:
      - name: 随机错峰 0-30 分钟
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay=$((RANDOM % 1801))
          echo "本次随机延迟 ${delay} 秒"
          sleep "$delay"

  mac:                     # macOS(dmg + 增量 tar.gz)
    runs-on: ubuntu-latest
    needs: jitter
    if: github.event.inputs.only == 'mac' || github.event.inputs.only == 'all' || github.event.inputs.only == '' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sync.sh mac-current

  # 一次性:探测补全 macOS 历史版本(仅手动 backfill=yes),同版本 CN+Global 合并。
  backfill-mac:
    runs-on: ubuntu-latest
    needs: jitter
    if: github.event.inputs.backfill == 'yes'
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sync.sh mac-backfill

  # 所有 Windows 文件按版本聚合:在线安装器 + 中国合体版 + 国内/国际三引擎。
  win-offline:
    runs-on: ubuntu-latest
    needs: jitter
    if: github.event.inputs.only == 'offline' || github.event.inputs.only == 'all' || github.event.inputs.only == '' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 同步并合并 Windows 完整包
        run: |
          bash scripts/sync.sh win-offline
          bash scripts/sync.sh win-full
          bash scripts/sync.sh win-installer

  merge-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.merge_from != '' && inputs.merge_into != ''
    steps:
      - uses: actions/checkout@v4
      - name: 在 GitHub runner 内合并 Release 附件
        run: bash scripts/merge_release_assets.sh "${{ inputs.merge_from }}" "${{ inputs.merge_into }}"

  # keepalive:距上次提交 >50 天推空提交,防 schedule 因 60 天不活跃被禁用
  keepalive:
    runs-on: ubuntu-latest
    needs: [mac, backfill-mac, win-offline]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if near inactivity threshold
        run: |
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交 ${DAYS} 天"
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          else
            echo "⏭ 无需 keepalive (< 50 天)"
          fi
