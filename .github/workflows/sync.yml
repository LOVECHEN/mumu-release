name: Sync MuMu

# 每日把 MuMu 官方安装包镜像到 GitHub Releases:
#  - macOS dmg + 增量 tar.gz / Windows 在线安装器 exe · 中国版 + 国际版(mirror job,走官方 api 端点)
#  - Windows 完整离线安装包 MuMu-setup-V*.exe ~830MB(offline-win job,走社区索引取直链)
# 源地址均为网易官方公开下载(mumu.163.com / mumuplayer.com / a11.gdl.netease.com CDN)。
# 每个版本一个独立 Release,历史累积不删。
# ★注意 Windows 三个版本号:产品/模拟器版本 V6.x(离线包标题用)/ 在线安装器"下载器"版本 6.0.x / 离线包内部构建号 V5.30.x。

on:
  schedule:
    - cron: '0 6 * * *'   # 每天 06:00 UTC = 北京 14:00(当前版本)
  workflow_dispatch:
    inputs:
      only:
        description: '仅处理某渠道 (mac-cn/mac-global/win-cn/win-global/all)'
        required: false
        default: 'all'
      backfill:
        description: '一次性:探测补全 macOS 历史版本 (yes/no,仅手动触发时用)'
        required: false
        default: 'no'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # key       plat  chan     product 标题                       api 端点(每次重签直链)                                              增量 updater 模板({V}=版本,404 自动跳过)
          - { key: mac-cn,     plat: mac, chan: cn,     title: 'MuMuPlayer Pro',        cn_title: 'macOS 中国版',   api: 'https://mumu.nie.netease.com/api/dl/mac?channel=gw-mac',            updater: 'https://a11.gdl.netease.com/MuMuUpdater_{V}_default.tar.gz' }
          - { key: mac-global, plat: mac, chan: global, title: 'MuMuPlayer Pro',        cn_title: 'macOS 国际版',   api: 'https://api.mumuplayer.com/api/dl/mac?channel=gw-mac-download',     updater: 'https://a11.gdl.netease.com/MuMuMacUpdater_{V}-global.tar.gz' }
          - { key: win-cn,     plat: win, chan: cn,     title: 'MuMu模拟器12 在线安装器', cn_title: 'Windows 中国版', api: 'https://mumu.nie.netease.com/api/dl/win?channel=gw-win',            updater: '' }
          - { key: win-global, plat: win, chan: global, title: 'MuMu Player 12 在线安装器', cn_title: 'Windows 国际版', api: 'https://api.mumuplayer.com/api/dl/win?channel=gw-win-download',     updater: '' }
    steps:
      - name: Filter channel
        id: filter
        run: |
          WANT="${{ github.event.inputs.only || 'all' }}"
          if [[ "$WANT" != "all" && "$WANT" != "${{ matrix.key }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭ 跳过 ${{ matrix.key }}(本次仅要 $WANT)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover & mirror
        if: steps.filter.outputs.skip != 'true'
        env:
          KEY:      ${{ matrix.key }}
          PLAT:     ${{ matrix.plat }}
          CHAN:     ${{ matrix.chan }}
          PRODUCT:  ${{ matrix.title }}
          CN_TITLE: ${{ matrix.cn_title }}
          API:      ${{ matrix.api }}
          UPDATER:  ${{ matrix.updater }}
        run: |
          set -uo pipefail

          # —— 1. 发现:跟随 302,从官方文件名解析版本 ——
          LOC=$(curl -fsS --http1.1 -m 40 -o /dev/null -w '%{redirect_url}' "$API" 2>/dev/null || true)
          if [ -z "$LOC" ]; then echo "❌ [$KEY] api 未返回重定向,跳过"; exit 0; fi
          FILE="${LOC##*/}"; FILE="${FILE%%\?*}"                       # 官方原始文件名(去签名 query)
          VER=$(printf '%s' "$FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VER" ]; then echo "❌ [$KEY] 无法从 '$FILE' 解析版本,跳过"; exit 0; fi

          TAG="$KEY-$VER"
          # win 的 VER 是"下载器/在线安装器"自身版本(≠产品/模拟器版本 V6.x);mac 的 VER 即产品版本
          if [ "$PLAT" = "win" ]; then TITLE="$CN_TITLE · $PRODUCT (下载器 v$VER)"; else TITLE="$CN_TITLE · $PRODUCT $VER"; fi
          echo "═══ $TAG ($FILE) ═══"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "  ⏭ 已存在,跳过"; exit 0
          fi
          echo "  🆕 开始镜像"

          DIR="rel-$TAG"; mkdir -p "$DIR"
          NOTES="notes-$TAG.md"
          {
            echo "## $TITLE"; echo
            echo "🔖 渠道:$CN_TITLE　|　🧩 版本:\`$VER\`"; echo
            echo "### 下载文件"; echo
            echo "| 类型 | 文件 | 大小 |"
            echo "|------|------|------|"
          } > "$NOTES"

          BARE="${LOC%%\?*}"   # 无签名裸 CDN 直链(GCS 直存,稳定 200,不受签名 IP 绑定/过期约束)

          FAIL=0; TOTAL=0; ASSETS=()
          # dl <保存文件名> <类型说明> <候选直链...> —— 逐条尝试直至成功;curl 一律 2>/dev/null 不回显直链
          dl() {
            local file="$1" kind="$2"; shift 2
            local url sz mb ok=0
            TOTAL=$((TOTAL+1))
            echo "  📥 [$kind] $file 拉取中..."
            for url in "$@"; do
              [ -z "$url" ] && continue
              if curl -fL --http1.1 --retry 5 --retry-delay 6 --retry-all-errors --retry-connrefused --connect-timeout 40 -o "$DIR/$file" "$url" 2>/dev/null; then
                ok=1; break
              fi
              echo "    ↻ 换直链重试..."
            done
            if [ "$ok" = 1 ]; then
              sz=$(stat -c%s "$DIR/$file"); mb=$((sz/1048576))
              printf '| %s | `%s` | %d MB |\n' "$kind" "$file" "$mb" >> "$NOTES"
              ASSETS+=("$DIR/$file")
              echo "    ✅ $mb MB"
            else
              echo "    ❌ 下载失败"; rm -f "$DIR/$file"; FAIL=$((FAIL+1))
            fi
          }

          # 主安装包:裸 CDN 直链优先,退回 api 重签直链,存成官方原名
          case "$PLAT" in
            mac) KIND="🍎 全量安装 (Apple Silicon · dmg)";;
            win) KIND="🪟 在线安装器 (64-bit · exe · 运行后再拉完整包)";;
            *)   KIND="安装包";;
          esac
          dl "$FILE" "$KIND" "$BARE" "$API"

          # macOS 增量热更包 tar.gz(有则附,404 自动跳过)
          if [ -n "$UPDATER" ]; then
            UURL="${UPDATER//\{V\}/$VER}"; UFILE="${UURL##*/}"
            if curl -fsSI --http1.1 -m 30 "$UURL" >/dev/null 2>&1; then
              dl "$UFILE" "🍎 增量热更 (updater · tar.gz)" "$UURL"
            else
              echo "  ⏭ 无增量 tar.gz(未发布),跳过"
            fi
          fi

          if [ "$TOTAL" -eq 0 ] || [ "$FAIL" -ge "$TOTAL" ]; then
            echo "  ❌ 无任何文件成功,跳过发布"; rm -rf "$DIR" "$NOTES"; exit 0
          fi

          ( cd "$DIR" && sha256sum -- * > ../ck.tmp && mv ../ck.tmp checksums.sha256 )
          ASSETS+=("$DIR/checksums.sha256")
          {
            echo; echo "### SHA256 校验"; echo '```'; cat "$DIR/checksums.sha256"; echo '```'; echo
            echo "---"
            echo "> 🤖 自动镜像于 $(date -u '+%Y-%m-%d %H:%M UTC') · 源自网易 MuMu 官方公开下载入口"
            echo "> ⚠️ 本仓库仅镜像官方**未修改**安装包,不含任何破解 / 授权绕过。"
          } >> "$NOTES"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --latest=false \
            "${ASSETS[@]}"
          echo "  ✅ 已发布 $TAG(资产:${#ASSETS[@]} 个)"
          rm -rf "$DIR" "$NOTES"

  # offline-win:Windows 完整离线安装包(MuMu-setup-V*.exe,~830MB)。
  # 官方下载按钮只给在线安装器,离线完整包无干净官方端点;唯一跟踪其确切 CDN 直链的
  # 是社区索引(悟透 cnblogs,newest-first)。从中取最新离线包 URL + 产品(模拟器)版本号,
  # 裸 CDN 直链下载后发布为 win-cn-offline-<产品版本>。索引拉取/解析失败则跳过,不影响其它 job。
  offline-win:
    runs-on: ubuntu-latest
    steps:
      - name: Discover & mirror 完整离线安装包 (CN)
        env:
          INDEX: 'https://www.cnblogs.com/wutou/p/19476571'   # 悟透:MuMu Win x86-64 下载器/安装包历史版本
        run: |
          set -uo pipefail
          HTML=$(curl -fsSL --http1.1 -m 40 -A 'Mozilla/5.0' "$INDEX" 2>/dev/null || true)
          if [ -z "$HTML" ]; then echo "❌ 索引页拉取失败,跳过离线包"; exit 0; fi

          # 最新离线安装包直链(页面 newest-first,取第一个 a11.gdl 的 MuMu-setup-V*.exe)
          URL=$(printf '%s' "$HTML" | grep -oE 'https://a11\.gdl\.netease\.com/MuMu-setup-V[0-9.]+-[0-9]+\.exe' | head -1)
          [ -z "$URL" ] && URL=$(printf '%s' "$HTML" | grep -oE 'MuMu-setup-V[0-9.]+-[0-9]+\.exe' | head -1 | sed 's#^#https://a11.gdl.netease.com/#')
          if [ -z "$URL" ]; then echo "❌ 未从索引解析到 MuMu-setup,跳过"; exit 0; fi
          FILE="${URL##*/}"
          # 产品/模拟器版本(该行的 V6.x;页面第一个 V\d.\d.\d 即最新行的模拟器版本)
          PVER=$(printf '%s' "$HTML" | grep -oE 'V[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$PVER" ] && PVER="V$(printf '%s' "$FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"

          TAG="win-cn-offline-$PVER"
          TITLE="Windows 中国版 · MuMu模拟器12 完整离线安装包 $PVER"
          echo "═══ $TAG ($FILE) ═══"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "  ⏭ 已存在,跳过"; exit 0
          fi
          echo "  🆕 开始镜像离线包"

          DIR="rel-$TAG"; mkdir -p "$DIR"
          echo "  📥 $FILE 拉取中(~800MB)..."
          if ! curl -fL --http1.1 --retry 5 --retry-delay 6 --retry-all-errors --retry-connrefused --connect-timeout 40 -o "$DIR/$FILE" "$URL" 2>/dev/null; then
            echo "  ❌ 离线包下载失败,跳过"; rm -rf "$DIR"; exit 0
          fi
          SZ=$(stat -c%s "$DIR/$FILE"); MB=$((SZ/1048576)); echo "  ✅ $MB MB"
          ( cd "$DIR" && sha256sum -- * > ../ck.tmp && mv ../ck.tmp checksums.sha256 )

          NOTES="notes-$TAG.md"
          {
            echo "## $TITLE"; echo
            echo "🔖 产品(模拟器)版本:\`$PVER\`　|　🧩 安装包内部版本:\`${FILE}\`"; echo
            echo "### 下载文件"; echo
            echo "| 类型 | 文件 | 大小 |"
            echo "|------|------|------|"
            printf '| %s | `%s` | %d MB |\n' "🪟 完整离线安装包 (64-bit · exe · 免联网直装)" "$FILE" "$MB"
            echo; echo "### SHA256 校验"; echo '```'; cat "$DIR/checksums.sha256"; echo '```'; echo
            echo "> 📌 这是 **MuMu模拟器12 $PVER 完整离线安装包**(在线安装器运行后要拉的完整包,这里直接给你)。"
            echo "> ℹ️ 文件名的 \`V5.30.x\` 是安装包内部构建号,装出来即产品 **$PVER**。"
            echo "---"
            echo "> 🤖 自动镜像于 $(date -u '+%Y-%m-%d %H:%M UTC') · 直链源自网易 CDN(a11.gdl.netease.com),版本索引源自社区整理页。"
            echo "> ⚠️ 仅镜像官方**未修改**安装包,不含任何破解 / 授权绕过。"
          } > "$NOTES"

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --notes-file "$NOTES" --latest=false "$DIR/$FILE" "$DIR/checksums.sha256"
          echo "  ✅ 已发布 $TAG"
          rm -rf "$DIR" "$NOTES"

  # backfill-mac:一次性探测补全 macOS 历史版本(dmg + 增量 tar.gz · CN/Global)。
  # 网易 CDN 对老版本保留不规律(有的只留 dmg、有的只留 tar.gz、有的全删),
  # 故遍历候选版本号,逐个 HEAD 探测 4 类 URL,把还活着的历史包补成 mac-<渠道>-<版本> release。
  # ★仅手动触发(Run workflow → backfill=yes)才跑,不进日常 schedule;已存在的 release 跳过。
  backfill-mac:
    runs-on: ubuntu-latest
    if: github.event.inputs.backfill == 'yes'
    steps:
      - name: Probe & backfill 历史 macOS 版本
        run: |
          set -uo pipefail
          CDN="https://a11.gdl.netease.com"
          # 候选版本号(网易 mac 版号不连续,给足范围;不存在的自然 404 跳过)
          CANDS=""
          for mp in 1.6 1.7 1.8 1.9; do for p in $(seq 0 45); do CANDS="$CANDS $mp.$p"; done; done

          exists() { curl -fsSI --http1.1 -m 20 "$1" >/dev/null 2>&1; }   # HEAD 探测
          NEW=0
          for V in $CANDS; do
            for CH in cn global; do
              TAG="mac-$CH-$V"
              # 该渠道的 dmg / tar.gz 直链(命名 CN/Global 不对称)
              if [ "$CH" = "cn" ]; then
                DMG="$CDN/MuMuPlayer_${V}_default.dmg";       TGZ="$CDN/MuMuUpdater_${V}_default.tar.gz"
                CNAME="macOS 中国版"
              else
                DMG="$CDN/MuMuPlayer_${V}_global.dmg";        TGZ="$CDN/MuMuMacUpdater_${V}-global.tar.gz"
                CNAME="macOS 国际版"
              fi
              HAS_DMG=false; HAS_TGZ=false
              exists "$DMG" && HAS_DMG=true
              exists "$TGZ" && HAS_TGZ=true
              $HAS_DMG || $HAS_TGZ || continue                # 两个都没有 → 该渠道该版本不存在
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                continue                                       # 已有(含当前版本)→ 跳过
              fi
              echo "═══ 补全 $TAG (dmg=$HAS_DMG tgz=$HAS_TGZ) ═══"

              DIR="rel-$TAG"; mkdir -p "$DIR"; ASSETS=(); ROWSFILE="rows-$TAG.tmp"; : > "$ROWSFILE"
              get() { # url filename kind
                local u="$1" f="$2" k="$3" sz mb
                if curl -fL --http1.1 --retry 5 --retry-delay 6 --retry-all-errors --retry-connrefused --connect-timeout 40 -o "$DIR/$f" "$u" 2>/dev/null; then
                  sz=$(stat -c%s "$DIR/$f"); mb=$((sz/1048576)); ASSETS+=("$DIR/$f")
                  printf '| %s | `%s` | %d MB |\n' "$k" "$f" "$mb" >> "$ROWSFILE"
                  echo "  ✅ $f ($mb MB)"
                else echo "  ❌ $f 下载失败"; rm -f "$DIR/$f"; fi
              }
              $HAS_DMG && get "$DMG" "${DMG##*/}" "🍎 全量安装 (Apple Silicon · dmg)"
              $HAS_TGZ && get "$TGZ" "${TGZ##*/}" "🍎 增量热更 (updater · tar.gz)"
              if [ "${#ASSETS[@]}" -eq 0 ]; then echo "  ⏭ 全部下载失败,跳过"; rm -rf "$DIR"; continue; fi

              ( cd "$DIR" && sha256sum -- * > ../ck.tmp && mv ../ck.tmp checksums.sha256 )
              ASSETS+=("$DIR/checksums.sha256")
              NOTES="notes-$TAG.md"
              {
                echo "## $CNAME · MuMuPlayer Pro $V（历史版本）"; echo
                echo "🕰️ 历史版本补全 · 🧩 版本:\`$V\`"; echo
                echo "### 下载文件"; echo
                echo "| 类型 | 文件 | 大小 |"; echo "|------|------|------|"
                cat "$ROWSFILE"
                echo; echo "### SHA256 校验"; echo '```'; cat "$DIR/checksums.sha256"; echo '```'; echo
                echo "---"
                echo "> 🤖 历史版本探测补全于 $(date -u '+%Y-%m-%d %H:%M UTC') · 裸 CDN 直链(a11.gdl.netease.com)。"
                echo "> ⚠️ 老版本网易 CDN 保留不规律,能补到哪算哪;仅镜像官方未修改安装包。"
              } > "$NOTES"

              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$CNAME · MuMuPlayer Pro $V（历史）" \
                --notes-file "$NOTES" --prerelease "${ASSETS[@]}"
              echo "  ✅ 已补全 $TAG"; NEW=$((NEW+1))
              rm -rf "$DIR" "$NOTES" "$ROWSFILE"
            done
          done
          echo "本次补全 $NEW 个历史 release"

  # set-latest:把 macOS 中国版(旗舰,版本最高)标为仓库 Latest
  set-latest:
    runs-on: ubuntu-latest
    needs: [mirror, offline-win, backfill-mac]
    if: always()
    steps:
      - name: 标记仓库 Latest
        run: |
          set -e
          pick() { # $1 = tag 前缀,取该前缀下版本号最高的 tag
            gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' \
              | grep -E "^$1-[0-9]" \
              | sed -E "s/^$1-//" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 \
              | sed "s/^/$1-/"
          }
          BEST=$(pick mac-cn)
          [ -z "$BEST" ] && BEST=$(pick mac-global)
          [ -z "$BEST" ] && BEST=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[0].tagName')
          if [ -n "$BEST" ]; then
            echo "标记 Latest: $BEST"
            gh release edit "$BEST" --repo "$GITHUB_REPOSITORY" --latest
          else
            echo "⏭ 无 release,跳过"
          fi

  # keepalive:距上次提交 >50 天推空提交,防 schedule 因 60 天不活跃被禁用
  keepalive:
    runs-on: ubuntu-latest
    needs: [mirror, offline-win, backfill-mac]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if near inactivity threshold
        run: |
          LAST=$(git log -1 --format=%ct); NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交 ${DAYS} 天"
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — 防 schedule 60 天不活跃被禁用"
            git push
          else
            echo "⏭ 无需 keepalive (< 50 天)"
          fi
